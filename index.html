<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — LAST METERS</title>
<meta name="description" content="自己紹介とリンク集。AIエージェント前提の物流「ラスト数メートル」を再設計するプロジェクト LAST METERS。">
<meta name="theme-color" content="#0a0c12">
<meta property="og:title" content="Profile — LAST METERS">
<meta property="og:description" content="AIエージェント前提の社会インフラを、物流の「ラスト数メートル」から再設計しています。">
<meta property="og:type" content="profile">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/i18n.js"></script>
<style>
  /* ---------- hero ---------- */
  .hero { padding: 56px 0 8px; text-align: center; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto 18px;
    border-radius: 50%; display: grid; place-items: center;
    font-size: 32px; font-weight: 700; letter-spacing: 0.02em;
    color: #06121f;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--brand-1) 12%, transparent), var(--shadow);
    object-fit: cover; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .hero h1 { font-size: 30px; margin-bottom: 2px; }
  .hero .roman { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 14px; }
  .nick-chip {
    display: inline-block; margin: 0 0 12px;
    padding: 3px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700;
    color: var(--brand-2);
    background: color-mix(in srgb, var(--brand-2) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--brand-2) 34%, transparent);
  }
  .hero .role { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; text-wrap: balance; }
  .hero .loc { font-size: 13px; color: var(--text-faint); margin-bottom: 16px; }
  .hero .headline {
    font-size: 15px; color: var(--text-dim); max-width: 460px; margin: 0 auto 18px;
    text-align: left; text-wrap: pretty;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 26px; }

  /* ---------- link list ---------- */
  .links { display: grid; gap: 10px; }
  .link-row {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text); text-decoration: none;
    box-shadow: var(--shadow-soft);
    transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    min-height: 66px;
  }
  .link-row:hover { text-decoration: none; transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent, var(--brand-1)) 55%, var(--border)); }
  .link-row:active { transform: scale(0.99); }
  .link-ico {
    width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent, var(--brand-1)) 15%, transparent);
    color: var(--accent, var(--brand-1));
    border: 1px solid color-mix(in srgb, var(--accent, var(--brand-1)) 28%, transparent);
  }
  .link-txt { flex: 1 1 auto; min-width: 0; }
  .link-txt b { display: block; font-size: 15.5px; font-weight: 650; }
  .link-txt span { display: block; font-size: 12.5px; color: var(--text-faint); }
  .link-row .chev { color: var(--text-faint); flex: 0 0 auto; }
  .link-row.featured {
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      color-mix(in srgb, var(--surface) 92%, transparent);
    border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
  }

  /* ---------- project ---------- */
  .project {
    margin-top: 28px; padding: 20px;
    border-radius: var(--radius-lg);
    border: 1px solid color-mix(in srgb, var(--brand-2) 30%, var(--border));
    background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--brand-2) 13%, transparent), transparent 62%),
      color-mix(in srgb, var(--surface) 90%, transparent);
    box-shadow: var(--shadow);
  }
  .codename {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.2em; color: var(--brand-2);
  }
  .codename::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-2); box-shadow: 0 0 10px var(--brand-2); }
  .project h2 { font-size: 20px; margin: 10px 0 8px; }
  .project p { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; }
  .project-links { display: grid; gap: 8px; }
  .plink {
    display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 4px 10px;
    padding: 12px 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface-2) 70%, transparent);
    color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600;
    min-height: 48px;
  }
  .plink svg { grid-row: 1; }
  .plink:hover { text-decoration: none; border-color: var(--brand-2); }
  .plink.cta { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #06121f; border-color: transparent; }
  .plink .pnote { grid-column: 2; font-weight: 400; font-size: 11.5px; opacity: 0.8; }
  @media (min-width: 480px) {
    .plink { grid-template-columns: 18px auto 1fr; }
    .plink .pnote { grid-column: 3; grid-row: 1; text-align: right; }
  }

  /* ---------- actions ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }

  /* ---------- QR sheet ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(4, 6, 12, 0.72); backdrop-filter: blur(6px);
  }
  .sheet[data-open="true"] { display: flex; }
  .sheet-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px; max-width: 360px; width: 100%; text-align: center; box-shadow: var(--shadow);
  }
  .qr-frame { background: #fff; border-radius: 14px; padding: 14px; display: block; margin: 0 auto 14px; width: 232px; height: 232px; }
  .qr-frame img { width: 100%; height: 100%; display: block; }

  /* ---------- setup banner ---------- */
  .setup {
    margin: 0 auto 18px; max-width: var(--maxw);
    border: 1px dashed color-mix(in srgb, var(--warn) 55%, transparent);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    color: var(--text); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 13px; margin-top: 56px;
  }
  .setup code { background: color-mix(in srgb, var(--warn) 16%, transparent); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
    background: var(--surface-3); color: var(--text); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all 0.22s ease; z-index: 200;
  }
  .toast[data-show="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 560px) {
    .hero { padding-top: 72px; }
    .hero h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="grid-lines"></div>

<div class="top-controls">
  <button class="btn btn-sm lang-btn" id="langBtn" type="button">EN</button>
  <button class="theme-toggle" id="themeBtn" type="button" aria-label="Theme">◐</button>
</div>

<main class="wrap">
  <div id="setupBanner"></div>

  <header class="hero">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="nameJa"></h1>
    <div class="roman" id="nameRoman"></div>
    <div id="nick"></div>
    <div class="role" id="role"></div>
    <div class="loc" id="loc"></div>
    <p class="headline" id="headline"></p>
    <div class="tags" id="tags"></div>
  </header>

  <nav class="links" id="links" aria-label="リンク一覧"></nav>

  <section class="project" id="project" aria-labelledby="projTitle"></section>

  <div class="actions">
    <button class="btn btn-sm" id="qrBtn" type="button">
      <span data-l="ja">QRを表示</span><span data-l="en">Show QR</span>
    </button>
    <button class="btn btn-sm" id="copyBtn" type="button">
      <span data-l="ja">URLをコピー</span><span data-l="en">Copy link</span>
    </button>
    <button class="btn btn-sm hidden" id="shareBtn" type="button">
      <span data-l="ja">共有</span><span data-l="en">Share</span>
    </button>
    <button class="btn btn-sm hidden" id="vcardBtn" type="button">
      <span data-l="ja">連絡先を保存</span><span data-l="en">Save contact</span>
    </button>
  </div>

  <p class="footer">
    <span id="footName"></span>
    · <a href="./qr/"><span data-l="ja">QRを作り直す</span><span data-l="en">QR kit</span></a>
    · <a href="./plan/"><span data-l="ja">事業計画</span><span data-l="en">Business plan</span></a>
  </p>
</main>

<div class="sheet" id="qrSheet" role="dialog" aria-modal="true" aria-label="このページのQRコード">
  <div class="sheet-card">
    <div class="eyebrow" style="margin-bottom:12px">SCAN ME</div>
    <span class="qr-frame"><img src="assets/qr/profile-qr.svg" alt="このページへのQRコード" id="qrImg"></span>
    <div class="small mono" id="qrUrl" style="word-break:break-all;color:var(--text-faint);margin-bottom:14px"></div>
    <button class="btn btn-sm" id="qrClose" type="button">
      <span data-l="ja">閉じる</span><span data-l="en">Close</span>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="wrap" style="padding:40px 16px">
    <p>このページはJavaScriptでリンクを描画しています。JavaScriptを有効にしてください。</p>
    <p><a href="https://github.com/eigokono1058-tech">GitHub</a></p>
  </div>
</noscript>

<script src="assets/js/theme.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/profile-config.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
